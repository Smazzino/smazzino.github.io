<!DOCTYPE html>
<html>

</head>

<body>
    <a href="index.html" class="tasto-home">Le Barche a Vela</a>

    <h1>Lo Scafo</h1>

    <div class="doppiaImmagine">

        <div class="bloccoTitoloImm">
            <h2>Opera Viva:</h2>
            <p> La parte a contatto con l'acqua </p>
            <img src="fotoOperaViva.jpg"> 
        </div>

        <div class="bloccoTitoloImm">
            <h2>Coperta:</h2>
            <p> La parte superiore della barca </p>
            <img src="fotoCoperta.jpg"> 
        </div>
    </div>

    <h2 style="text-align: center;"> Appendici: </h2>

    <div class="doppiaImmagine">
        <div class="testoImmagine">
            <h3> Pala del Timone: </h3>
            <p> singola </p>
            <img src="fotoTimone.jpg" style=" width: 150px; height: auto">

            <p> oppure doppia</p>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS2WHw5k6EezwVrujJSmACUP78xx40n52hFy9zgqO4HLluYbpqFyuVrrXw&s=10" style="width: 400px; height: 300px;">
        </div>

    <div class="testoImmagine" >
        <h3> Deriva: </h3>
        <div style="cursor: pointer; color: rgb(55, 0, 255); text-decoration: none;">

            <p onclick="cambiaImmagine('fotoDerivaNOBulbo.jpg')"> senza bulbo</p>
        </div>
  
        <img id="foto-dinamica" src="fotoDerivaBulbo.jpg" class="immagineAllineata">

    <a href="paginaArmo.html" class="bottone-link">Armo</a>


    <script>
        function cambiaImmagine(nuovaImmagine) {                      // funzione che modifica l'immagine in base al click 
            const immagine = document.getElementById("foto-dinamica");
        
            immagine.src = nuovaImmagine;       // Assegna all'immagine il file corretto
        }
    </script>
