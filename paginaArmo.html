<!DOCTYPE html>
<html>
<head>
    <title>Armo</title>
    <link rel="stylesheet" href="style.css">    
</head>

<body>
    <a href="index.html" class="tasto-home">Le Barche a Vela</a>

    <h1>L'Armo</h1>

    <div class="testoImmagine">
        <div class="bloccoTitoloImm">
            <h2> Albero e Boma:</h2>
            <p> l'albero è composto da 
                <a href="https://it.wikipedia.org/wiki/Sartia" target="_blank">sartie</a> e
                <a href="https://it.wikipedia.org/wiki/Crocetta_(vela)" target="_blank">crocette</a>
            </p>
        </div>
        <img src="fotoAlbero.jpg" width="200" height="400">
    </div>

    <div class="testoImmagine">
        <div class="bloccoTitoloImm">
            <h2> Vele</h2>
            <h3> Ci sono diversi tipi di vele: </h3> 
        
            <div style="cursor: pointer; color: rgb(55, 0, 255); text-decoration: none;">
                <p onclick="cambiaImmagine('fotoRanda.jpg')"> Randa</p>
                <p onclick="cambiaImmagine('fotoFiocco.jpg')"> Fiocco</p>
                <p onclick="cambiaImmagine('fotoJennaker.jpg')"> Vele di Prua</p>
            </div>
        </div>
        
        <img id="foto-dinamica" src="https://images.unsplash.com/photo-1594739201538-838ea94344df?q=80&w=735&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" width="400" height="400">
    </div>

    <a href="paginaScafo.html" class="bottone-link">Scafo</a>


    <script>
        function cambiaImmagine(nuovaImmagine) {                      // funzione che modifica l'immagine in base al click 
            const immagine = document.getElementById("foto-dinamica");
        
            immagine.src = nuovaImmagine;       // Assegna all'immagine il file corretto

        if (nuovaImmagine === 'fotoJennaker.jpg') {
            immagine.width = 350; 
            immagine.removeAttribute("height"); 
        } else {
            // Per tutte le altre immagini, rimuove entrambi i vincoli dimensionali
            immagine.removeAttribute("width");
            immagine.removeAttribute("height");
        }
        }
    </script>


</body>
</html>
